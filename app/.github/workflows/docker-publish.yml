name: Build and Push MC3 Submission

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frees ~45-60 GB on the GitHub runner so the 29 GB ROCm base image + 15 GB Qwen model fit
      - name: Maximize build disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check available disk space
        run: df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push directly to Docker Hub
        # Using buildx with --push streams layers directly to registry to save local disk space
        run: |
          docker buildx create --use
          docker buildx build \
            --push \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mc3-submission:latest \
            .
